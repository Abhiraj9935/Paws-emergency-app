<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAWS - AI Animal Emergency SOS</title>
  <style>
    :root {
      --primary-green: #146b4b;
      --accent-green: #16a34a;
      --light-green-bg: #e6f4ea;
      --bg-slate: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-slate);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    header {
      background: var(--primary-green);
      border-bottom: 1px solid #115e3b;
      padding: 16px 0;
      color: white;
      box-shadow: 0 4px 6px -1px rgba(20, 107, 75, 0.15);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 24px;
      margin-bottom: 40px;
    }

    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary-green);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: #115e3b; }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }

    #mobileDebugBar {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
      color: #334155;
    }
  </style>

  <!-- TensorFlow.js Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
</head>
<body>
  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <h1 style="font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: 8px;">🐾 PAWS <span style="font-size: 0.85rem; font-weight: 300; color: #a7f3d0;">Emergency SOS</span></h1>
      <nav>
        <a href="responder.html" style="color: #a7f3d0; text-decoration: none; font-size: 0.9rem; font-weight: 500;">Responder Command Center</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="main-grid">
      
      <!-- Left: AI Camera Stream -->
      <section class="card">
        <h2 style="color: var(--primary-green); margin-top: 0; font-size: 1.15rem;">📷 Real-Time AI Camera Scanner</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">
          Point your camera at the animal. The AI scanner will identify the subject and auto-fill injury details.
        </p>

        <div class="video-container">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="canvasOverlay"></canvas>
        </div>

        <div id="mobileDebugBar">
          AI Status: <span id="debugText" style="color: #2563eb; font-weight: 700;">Initializing...</span>
        </div>
      </section>

      <!-- Right: SOS Report Form -->
      <section class="card">
        <h2 style="color: var(--primary-green); margin-top: 0; font-size: 1.15rem;">🚨 Submit Emergency SOS</h2>
        
        <form id="sosForm">
          <label style="font-size: 0.85rem; font-weight: 600;">Detected Animal & Condition</label>
          <input type="text" id="animalType" placeholder="Waiting for AI camera detection..." required>

          <label style="font-size: 0.85rem; font-weight: 600;">Urgency Assessment Level</label>
          <select id="urgency">
            <option value="high">Critical / Visible Injury (High Urgency)</option>
            <option value="medium" selected>Moderate / Stranded / Distressed (Medium)</option>
            <option value="low">Observation Required (Low)</option>
          </select>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-size: 0.85rem; font-weight: 600;">Reporter Name</label>
              <input type="text" id="reporterName" placeholder="Your Name" required>
            </div>
            <div>
              <label style="font-size: 0.85rem; font-weight: 600;">Phone Number</label>
              <input type="tel" id="reporterPhone" placeholder="+91 98765 43210" required>
            </div>
          </div>

          <label style="font-size: 0.85rem; font-weight: 600;">GPS Location Coordinates</label>
          <input type="text" id="location" placeholder="Acquiring GPS location..." readonly required>

          <label style="font-size: 0.85rem; font-weight: 600;">Automated AI Injury Assessment & Notes</label>
          <textarea id="description" rows="3" placeholder="AI diagnostic observations will auto-populate here..." required></textarea>

          <button type="submit" class="btn-submit">Broadcast Emergency SOS</button>
        </form>

        <p id="formStatus" style="margin-top: 10px; font-weight: 600; font-size: 0.9rem; text-align: center;"></p>
      </section>

    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
