<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PAWS Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">🐾 PAWS <span>Animal Rescue</span></a>
  <nav>
    <a href="index.html">Home / Live Camera</a>
    <a href="register.html">Register</a>
  </nav>
</header>
<main class="narrow">
  <section class="panel">
    <p class="eyebrow">RESPONDER ACCESS</p>
    <h1>Welcome back</h1>

    <!-- SIGN-IN FORM -->
    <form id="loginForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Password<input id="password" type="password" required></label>
      <button class="button" type="submit" id="loginBtn">Login</button>
      <p id="message" role="status"></p>
    </form>

    <!-- LOGGED-IN PROFILE & DASHBOARD STATUS -->
    <div id="profile" class="notice" hidden>
      <p id="profileText"></p>
      <div class="actions" style="margin-top: 15px;">
        <a href="index.html#sos" class="button">Go to SOS Dashboard</a>
        <button class="button secondary" type="button" id="logout">Log out</button>
      </div>
    </div>
  </section>
</main>
<script src="gemini-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
