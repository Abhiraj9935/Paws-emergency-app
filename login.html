<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAWS - Responder Login</title>
  <style>
    :root {
      --primary-green: #146b4b;
      --bg-slate: #f8fafc;
      --text-main: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-slate); font-family: system-ui, -apple-system, sans-serif; color: var(--text-main); }
    header { background: var(--primary-green); padding: 16px 0; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .login-card { max-width: 400px; margin: 60px auto; background: white; padding: 28px; border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    input { width: 100%; padding: 10px; margin-top: 4px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1 style="font-size: 1.25rem;">🐾 PAWS Responder Portal</h1>
    </div>
  </header>

  <main class="container">
    <div class="login-card">
      <h2 style="margin-bottom: 16px; color: var(--primary-green);">Sign In</h2>
      <form id="loginForm">
        <label style="font-size: 0.85rem; font-weight: 600;">Email Address</label>
        <input type="email" id="email" required placeholder="responder@paws.org">

        <label style="font-size: 0.85rem; font-weight: 600;">Password</label>
        <input type="password" id="password" required placeholder="••••••••">

        <button type="submit">Sign In to Command Center</button>
      </form>
      <p id="msg" style="margin-top: 12px; font-size: 0.85rem; font-weight: 600; text-align: center;"></p>
    </div>
  </main>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    if (firebaseConfig && firebaseConfig.apiKey) {
      const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
      const auth = getAuth(app);
      const form = document.getElementById("loginForm");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "Authenticating...";
        msg.style.color = "#2563eb";

        try {
          await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
          msg.textContent = "✔ Login Successful! Redirecting...";
          msg.style.color = "#16a34a";
          setTimeout(() => { window.location.href = "responder.html"; }, 800);
        } catch (err) {
          msg.textContent = "Login Failed: " + err.message;
          msg.style.color = "#dc2626";
        }
      });
    }
  </script>
</body>
</html>
